<html lang="en-GB">
  <head>

      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M16 7l8 4.5v9L16 25l-8-4.5v-9L16 7z' fill='none' stroke='%23ffffff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M16 16l8-4.5M16 16v9M16 16L8 11.5' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Yunlian Logistics · Operations Console</title>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('yunlian-theme')
          var theme = raw ? JSON.parse(raw)?.state?.theme : 'light'
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          } else {
            document.documentElement.classList.remove('dark')
            document.documentElement.style.colorScheme = 'light'
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
